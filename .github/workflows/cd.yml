name: cd

on:
  push:
    branches: [main]
  
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Use same npm as the lockfile was written with
        run: npm i -g npm@11.12.1

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      