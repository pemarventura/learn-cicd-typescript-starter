name: cd

on:
  push:
    branches: [main]
  
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Use same npm as the lockfile was written with
        run: npm i -g npm@11.12.1

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
      
      - name: Use gcloud CLI
        run: gcloud info
      
      - name: Build and push Docker image
        run: 
          gcloud builds submit --tag us-central1-docker.pkg.dev/gen-lang-client-0752569934/notely-ar-repo/notely:latest .
          
      - name: Deploy to Cloud Run
        run: 
          gcloud run deploy notely --image us-central1-docker.pkg.dev/gen-lang-client-0752569934/notely-ar-repo/notely:latest --region uscentral1 --allow-unauthenticated --project gen-lang-client-0752569934 --max-instances=4
      